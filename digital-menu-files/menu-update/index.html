<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Menus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, appetising, calm — a host handing you the menu.
   IDEA: a bound restaurant menu with coloured divider tabs, one per kitchen.
   PICTURE: each kitchen opens on its own full-width spread of real dishes.
   COLOUR and TYPE: white page, charcoal ink, each kitchen's logo colour as its accent; Marcellus titles, Figtree text.
   LAYOUT: sticky tab row, hero photo, courses as lists with dish photos at the right edge. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141312);--card:light-dark(#f6f4f1,#1e1c1a);--ink:light-dark(#1d1a17,#f1ede8);--mute:light-dark(#6b645c,#a8a097);--line:light-dark(#e7e2dc,#2e2b28);--ac:#e08a00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.top{padding:28px max(5vw,16px) 14px;max-width:1100px;margin:auto}
.top h1{font-size:clamp(32px,6vw,48px);line-height:1.05}
.top p{margin:6px 0 0;color:var(--mute)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px max(5vw,16px);max-width:1100px;margin:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#fff}
.tab:focus-visible,.dish button:focus-visible,.gal button:focus-visible,#q:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.search{max-width:1100px;margin:auto;padding:0 max(5vw,16px) 10px}
#q{width:100%;min-height:44px;font-size:16px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:0 max(5vw,16px) 40px}
.hero{position:relative;margin:18px 0 8px;border-radius:20px;overflow:hidden;aspect-ratio:16/8;background:var(--ac)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:60px 22px 20px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.hero h2{font-size:clamp(30px,5.5vw,52px);line-height:1.05}
.hero .sub{opacity:.9;margin-top:4px}
.leaf{background:radial-gradient(circle at 20% 30%,#5fb548 0 18%,transparent 19%),radial-gradient(circle at 75% 65%,#2f7d2a 0 24%,transparent 25%),radial-gradient(circle at 55% 15%,#8fd16f 0 12%,transparent 13%),linear-gradient(135deg,#245c22,#3a8f2c)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:8px 48px}
.course{padding-top:26px}
.course h3{font-size:26px;line-height:1.1;color:var(--ac);padding-bottom:8px;border-bottom:2px solid var(--ac)}
.course .note{color:var(--mute);font-size:14px;margin:6px 0 0}
ul{list-style:none;margin:0;padding:0}
.dish{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:64px}
.dish .n{flex:1;font-size:17px}
.dish .n small{display:block;color:var(--mute);font-size:14px}
.dish button{flex:none;width:72px;height:72px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--card)}
.dish img,.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal h3{font-size:24px;margin:34px 0 12px}
.gal .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal button{aspect-ratio:1;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in}
.empty{padding:30px 0;color:var(--mute)}
mark{background:color-mix(in srgb,var(--ac) 30%,transparent);color:inherit;border-radius:3px}
.hit{font-size:13px;color:var(--mute);display:block}
footer{text-align:center;color:var(--mute);font-size:14px;padding:30px 16px 40px;border-top:1px solid var(--line)}
#lb{position:fixed;inset:0;z-index:20;background:rgba(10,9,8,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;border-radius:12px}
#lb p{color:#fff;margin:12px 0 0;font-size:17px;text-align:center}
#lb button{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:24px;cursor:pointer}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
@media(max-width:600px){.hero{aspect-ratio:4/3;border-radius:16px}.dish button{width:64px;height:64px}}
</style>
</head>
<body>

  <p>Seven kitchens, one table. Tap a cuisine, then tap any photo to see it larger.</p>
</header>

</div>
<main id="main"></main>
<footer>Menus may change with the season. Please ask our team about allergies and dietary needs.</footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo"><button aria-label="Close">×</button><img alt=""><p></p></div>

const $=s=>document.querySelector(s),img=x=>(N.includes(x)?'':'../')+x+'.jpg',N='1c9f0d62 1f14fd70 2c18261a 2dee9346 4169c744 4fa8b04e 4fd84276 52ac6d05 576e4bf5 6c8901e4 85ba065c 8a5a7c97 8ee412be a4a2a48b a4a40c8c b7ab85f8 c02710f3 d4dd7ee4 dalmakhani ea229d25 eb1cc958 faca8a38 fishbun shorba'.split(' ');
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabs=$("#tabs"),main=$("#main"),q=$("#q"),lb=$("#lb");
tabs.innerHTML=M.map(m=>`<button class="tab" role="tab" id="t-${m.id}" data-id="${m.id}" style="--c:${m.c}" aria-selected="false">${m.tab}</button>`).join("");
const dishLi=(d,hl)=>{const[n,p,s]=d;const t=hl?n.replace(new RegExp(`(${hl})`,"ig"),"<mark>$1</mark>"):esc(n);
 return `<li class="dish"><span class="n">${t}${s?`<small>${esc(s)}</small>`:""}</span>${p?`<button data-img="${p}" data-cap="${esc(n)}" aria-label="Photo of ${esc(n)}"><img src="${img(p)}" alt="${esc(n)}" loading="lazy"></button>`:""}</li>`};
function show(id){
 const m=M.find(x=>x.id===id)||M[0];q.value="";
 document.documentElement.style.setProperty("--ac",m.c);
 for(const b of tabs.children)b.setAttribute("aria-selected",b.dataset.id===m.id);
 $(`#t-${m.id}`).scrollIntoView({block:"nearest",inline:"center"});
 main.innerHTML=`<div class="fade"><div class="hero ${m.hero?"":"leaf"}">${m.hero?`<img src="${img(m.hero)}" alt="A spread of ${m.tab} dishes">`:""}<div class="cap"><h2>${m.name}</h2><div class="sub">${m.sub}</div></div></div>
 <div class="cols">${m.courses.map(([h,note,ds])=>`<section class="course"><h3>${h}</h3>${note?`<p class="note">${note}</p>`:""}<ul>${ds.map(d=>dishLi(d)).join("")}</ul></section>`).join("")}</div>
 ${m.gal.length?`<section class="gal"><h3>More from the kitchen</h3><div class="row">${m.gal.map(x=>`<button data-img="${x}" data-cap="${m.name}" aria-label="Kitchen photo"><img src="${img(x)}" alt="Dish from ${m.name}" loading="lazy"></button>`).join("")}</div></section>`:""}</div>`;
}
function search(v){
 const s=v.trim().toLowerCase();if(!s){route();return}
 const r=s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
 const hits=M.flatMap(m=>m.courses.flatMap(([h,,ds])=>ds.filter(d=>(d[0]+" "+(d[2]||"")).toLowerCase().includes(s)).map(d=>({m,h,d}))));
 for(const b of tabs.children)b.setAttribute("aria-selected","false");
 document.documentElement.style.setProperty("--ac","#8a6a3a");
 main.innerHTML=`<section class="course"><h3>${hits.length} dish${hits.length===1?"":"es"} found</h3><ul>${hits.map(({m,h,d})=>dishLi(d,r).replace('<span class="n">',`<span class="n"><span class="hit" style="color:${m.c}">${m.tab} · ${h}</span>`)).join("")}</ul>${hits.length?"":`<p class="empty">Nothing matches “${esc(v)}”. Try another word.</p>`}</section>`;
}
function route(){const h=location.hash.slice(1);show(M.some(m=>m.id===h)?h:M[0].id)}
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;if(location.hash==="#"+b.dataset.id)show(b.dataset.id);else location.hash=b.dataset.id;window.scrollTo({top:0})});
addEventListener("hashchange",route);
q.addEventListener("input",()=>search(q.value));
main.addEventListener("click",e=>{const b=e.target.closest("[data-img]");if(!b)return;lb.querySelector("img").src=img(b.dataset.img);lb.querySelector("img").alt=b.dataset.cap;lb.querySelector("p").textContent=b.dataset.cap;lb.classList.add("on");lb.querySelector("button").focus()});
lb.addEventListener("click",()=>lb.classList.remove("on"));
addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("on")});
route();
}
